<div id="music-player-pane" class="bottom-pane-view hidden" data-pane-mode="music-player" hidden>
  <div class="music-player-shell" aria-label="Music player">
    <section id="music-library-pane" class="music-subpane music-library-pane" aria-labelledby="music-library-title">
      <div class="music-subpane-header">
        <h2 id="music-library-title">Song Library</h2>
        <button type="button" id="music-library-load">Load Current Folder</button>
      </div>
      <div id="music-library-status" class="music-library-status" role="status">
        Library not loaded.
      </div>
      <div id="music-library-tree" class="music-library-tree" role="tree" tabindex="0">
        <div class="music-empty-state">Load the current folder to show cached songs.</div>
      </div>
    </section>
    <div id="music-resizer-library-playlist" class="music-pane-resizer" role="separator" aria-orientation="vertical" title="Drag to resize music panels"></div>

    <section id="music-playlist-pane" class="music-subpane music-playlist-pane" aria-labelledby="music-playlist-title">
      <div class="music-subpane-header">
        <h2 id="music-playlist-title">Active Playlist</h2>
      </div>
      <div id="music-playlist-future-controls" class="music-playlist-future-controls" aria-label="Future playlist controls">
        <button type="button" disabled>Name</button>
        <button type="button" disabled>Save</button>
        <button type="button" disabled>Load</button>
      </div>
      <div class="music-playlist-table" role="table" aria-label="Active playlist">
        <div class="music-playlist-row music-playlist-heading" role="row">
          <div role="columnheader">Filename</div>
          <div role="columnheader">Relative Path</div>
        </div>
        <div id="music-playlist-list" class="music-playlist-list" role="rowgroup" tabindex="0">
          <div class="music-empty-state">Playlist is empty.</div>
        </div>
      </div>
    </section>
    <div id="music-resizer-playlist-playback" class="music-pane-resizer" role="separator" aria-orientation="vertical" title="Drag to resize music panels"></div>

    <section id="music-playback-pane" class="music-subpane music-playback-pane" aria-labelledby="music-playback-title">
      <h2 id="music-playback-title">Playback Controls</h2>
      <div class="music-playback-surface" aria-label="Playback controls">
        <div class="music-now-playing">
          <div class="music-art-shell">
            <img id="music-cover-art" class="music-cover-art hidden" alt="Current song cover art" hidden>
            <div id="music-art-placeholder" class="music-art-placeholder" aria-label="No cover art available"></div>
          </div>
          <div class="music-track-details">
            <div id="music-current-filename" class="music-current-filename" title="Current filename">No song selected</div>
            <div id="music-song-title" class="music-song-title" title="Song title">Title unavailable</div>
            <div id="music-song-artist" class="music-song-artist" title="Song artist">Artist unavailable</div>
          </div>
        </div>
        <div class="music-progress-group">
          <input type="range" id="music-progress-slider" class="music-progress-slider" min="0" max="0" value="0" step="1" aria-label="Playback position">
          <div class="music-time-row" aria-label="Playback time">
            <span id="music-elapsed-time" class="music-time-label">00:00:00</span>
            <span id="music-total-time" class="music-time-label">00:00:00</span>
          </div>
        </div>
        <div class="music-transport-row">
          <button type="button" id="music-prev" aria-label="Previous track" title="Previous track">
            <img class="music-button-icon" src="/assets/icons/material-icon-theme/music-prev.svg" alt="" aria-hidden="true">
            <span class="music-button-label">Prev</span>
          </button>
          <button type="button" id="music-play" aria-label="Play" title="Play">
            <img class="music-button-icon" src="/assets/icons/material-icon-theme/music-play.svg" alt="" aria-hidden="true">
            <span class="music-button-label">Play</span>
          </button>
          <button type="button" id="music-next" aria-label="Next track" title="Next track">
            <img class="music-button-icon" src="/assets/icons/material-icon-theme/music-next.svg" alt="" aria-hidden="true">
            <span class="music-button-label">Next</span>
          </button>
        </div>
        <div class="music-player-controls" aria-label="Playback mode controls">
          <button type="button" id="music-shuffle-toggle" aria-pressed="false" title="Toggle shuffle">
            <img class="music-button-icon" src="/assets/icons/material-icon-theme/music-shuffle.svg" alt="" aria-hidden="true">
            <span class="music-button-label">Order</span>
          </button>
          <button type="button" id="music-loop-toggle" aria-pressed="false" title="Toggle loop">
            <img class="music-button-icon" src="/assets/icons/material-icon-theme/music-loop.svg" alt="" aria-hidden="true">
            <span class="music-button-label">Loop</span>
          </button>
        </div>
        <div class="music-volume-row">
          <label class="music-volume-label" for="music-volume-slider">
            <img class="music-button-icon" src="/assets/icons/material-icon-theme/music-volume.svg" alt="" aria-hidden="true">
            <span class="music-button-label">Volume</span>
          </label>
          <input type="range" id="music-volume-slider" class="music-volume-slider" min="0" max="1" value="1" step="0.01" aria-label="Volume">
        </div>
      </div>
      <audio id="music-audio" preload="metadata"></audio>
    </section>

    <div id="music-library-context-menu" class="music-context-menu hidden" hidden>
      <button type="button" data-action="add-selected">Add to playlist</button>
      <button type="button" data-action="select-all">Select All</button>
    </div>
    <div id="music-playlist-context-menu" class="music-context-menu hidden" hidden>
      <button type="button" data-action="play">Play</button>
      <button type="button" data-action="remove">Remove</button>
      <button type="button" data-action="select-all">Select All</button>
    </div>
  </div>
</div>
