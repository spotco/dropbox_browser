<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="${icon_base_url}box-favicon.svg">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/css/music.css">
  <title>$page_title</title>
</head>
<body class="has-log-panel" data-current-folder-path="$current_folder_attr" data-current-sort-key="$current_sort_key_attr" data-current-sort-direction="$current_sort_direction_attr" data-music-library-poll-delay-ms="$music_library_poll_delay_ms_attr" data-client-render="$client_render_attr">
  <header>
    <div>
      <h1>$page_title</h1>
      <div class="meta">$remote / $rel_path - $local_note</div>
    </div>
    $sync_toggles
  </header>
  <main>
    <div class="topbar">
      <nav class="breadcrumbs">$crumbs <a id="refresh-cache" class="refresh-link" href="$refresh_href" title="Refresh cached metadata for this folder">&#8635; refresh</a></nav>
      $topbar_actions
    </div>
    $msg_html
    $browse_filter_html
    $browse_table_html
  </main>
  <div id="browse-scroll-preview" class="browse-scroll-preview hidden" aria-hidden="true">
    <div id="browse-scroll-preview-index" class="browse-scroll-preview-index"></div>
    <div id="browse-scroll-preview-name" class="browse-scroll-preview-name"></div>
    <div id="browse-scroll-preview-meta" class="browse-scroll-preview-meta"></div>
    <div id="browse-scroll-preview-detail" class="browse-scroll-preview-detail"></div>
  </div>
  <div id="sync-popup" class="sync-popup hidden">
    <div class="sync-popup-head">
      <strong>Sync</strong>
      <button type="button" id="sync-popup-hide">Hide</button>
    </div>
    <div id="sync-popup-message">Waiting</div>
    <div id="sync-popup-command"></div>
    <div class="sync-progress"><div id="sync-progress-bar"></div></div>
  </div>
  <div id="batch-confirm" class="batch-confirm hidden">
    <div class="batch-confirm-box">
      <h2>Confirm Batch Sync</h2>
      <div id="batch-confirm-summary"></div>
      <div id="batch-confirm-list"></div>
      <div class="batch-confirm-actions">
        <button type="button" id="batch-confirm-cancel">Cancel</button>
        <button type="button" id="batch-confirm-run">Run</button>
      </div>
    </div>
  </div>
  <div id="refresh-blocker" class="refresh-blocker hidden">
    <div class="refresh-box">
      <h2>Refreshing Cache</h2>
      <div id="refresh-message">Refreshing current folder</div>
      <div class="sync-progress"><div id="refresh-progress-bar" class="running"></div></div>
    </div>
  </div>
  <div id="log-panel">
    <div id="log-resizer" title="Drag to resize bottom pane"></div>
    <div id="log-toolbar">
      <span id="log-grip" aria-hidden="true">&#8942;</span>
      <label for="bottom-pane-mode" id="bottom-pane-label">Pane</label>
      <select id="bottom-pane-mode" aria-label="Bottom pane mode">
        <option value="server-log">Server Log</option>
        <option value="music-player">Music Player</option>
      </select>
      <div id="music-player-status" class="music-player-status hidden" role="status" aria-live="polite" hidden>
        <span id="music-player-status-text" class="music-player-status-text">Library not loaded.</span>
      </div>
    </div>
    <div id="server-log-pane" class="bottom-pane-view" data-pane-mode="server-log">
      <div id="log-entries"></div>
    </div>
    $music_player_html
  </div>
  $browse_script_tags
</body>
</html>
